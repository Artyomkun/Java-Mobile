plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'ru.homework.notes'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.homework.notes'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
}
